# Overlay explícito para una instalación nueva en un VPS.
# Invocar siempre con -p pos-production y un env-file privado.
services:
  mysql:
    environment:
      MYSQL_DATABASE: ${POS_DATABASE_NAME:?Set POS_DATABASE_NAME in the private production env file}

  backend:
    image: ${POS_BACKEND_IMAGE:-pos-backend:production}
    environment:
      NODE_ENV: production
      DB_NAME: ${POS_DATABASE_NAME:?Set POS_DATABASE_NAME in the private production env file}
      TRUST_PROXY_HOPS: "2"
      # Omit all three values to disable local license issuance temporarily.
      LOCAL_LICENSE_CODE_PEPPER: ${LOCAL_LICENSE_CODE_PEPPER:-}
      LOCAL_LICENSE_SIGNING_KEY_ID: ${LOCAL_LICENSE_SIGNING_KEY_ID:-}
      LOCAL_LICENSE_SIGNING_PRIVATE_KEY: ${LOCAL_LICENSE_SIGNING_PRIVATE_KEY:-}

  frontend:
    image: ${POS_FRONTEND_IMAGE:-pos-frontend:production}
    ports:
      - "127.0.0.1:${POS_HTTP_PORT:-8080}:80"

  migrate:
    image: ${POS_BACKEND_IMAGE:-pos-backend:production}
    environment:
      DB_NAME: ${POS_DATABASE_NAME:?Set POS_DATABASE_NAME in the private production env file}
