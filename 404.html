<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 - No encontrado</title>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #1f2937;
    }

    .card {
      max-width: 520px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 3rem;
      color: #111827;
    }

    p {
      margin: 0;
      font-size: 1rem;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <p>Este recurso no está disponible en este entorno.</p>
  </main>
</body>
</html>
